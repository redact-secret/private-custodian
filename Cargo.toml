[workspace]
resolver = "2"
members = [
    "crates/custodian-core",
    "crates/custodian-contracts",
    "crates/custodian-service",
    "crates/custodian-corpus",
    "crates/custodian-store",
    "crates/custodian-intake",
    "crates/custodian-ledger",
    "crates/custodian-worker",
    "crates/custodian-disclosure",
    "crates/custodian-lifecycle",
    "crates/custodian-bridge",
    "crates/custodian-cli",
    "crates/custodian-verify",
    "crates/custodian-signer",
    "crates/custodian-daemon",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT" # See LICENSE and ADR 0103; covers source only, not protected data or evaluation access.

[workspace.lints.rust]
unsafe_code = "forbid"
