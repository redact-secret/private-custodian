name: ci

# Ordinary CI uses public synthetic tests only. It receives no secrets, no
# protected data, no signing material and no GitHub App credentials.
#
# "Synthetic conformance" job set (S1, ADR 0110; docs/ci-and-reusable-workflows.md):
# the `rust` job (unit, integration and the whole C12 suite) and the
# `worker-isolation` job below, plus the jobs of synthetic-conformance.yml.
# These are functional verification on public synthetic data with test-generated
# keys. They are not an independent protected evaluation.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: "synthetic conformance: rust (fmt, clippy, tests, C12 suite)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions/checkout v4.2.2, pinned to the commit its release tag points at.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # Uses the Rust toolchain preinstalled on the runner image; no third-party action.
      - name: Toolchain versions
        run: |
          rustup component add rustfmt clippy
          cargo --version
          rustc --version
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      # C12: a second, independent implementation of the canonical encoding and
      # the domain-separated digest, checked against the golden vectors. Python 3
      # standard library only (preinstalled on the runner); no package install.
      - name: Second-implementation golden vectors
        run: python3 crates/custodian-contracts/testdata/verify_golden.py
      - name: PII synthetic artifact delivery controls
        run: python3 -m unittest discover -s tools/engines -p 'test_*.py'
      - name: MicroVM read-only preflight negative controls (no AWS credentials)
        run: python3 -m unittest discover -s tests/microvm-conformance
      - name: EC2 worker template static controls (offline, deploys nothing)
        run: python3 -m unittest discover -s tests/ec2-conformance
      - name: P7 cost estimator refuses totals with unmeasured inputs (offline)
        run: python3 -m unittest discover -s tests/poc-cost

  # C12: dependency audit with a pinned tool and the policy in deny.toml
  # (RustSec advisories, yanked crates, licenses of third-party crates, crate
  # sources). cargo-deny is built from source with its own lockfile
  # (`--locked`) at an exact version; no third-party action and no secret. The
  # RustSec database is fetched fresh on every run by design: an audit against a
  # stale copy would prove little. Update the version here and in deny.toml
  # together, deliberately.
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install cargo-deny 0.20.2
        run: cargo install cargo-deny --locked --version 0.20.2
      - name: Check advisories, bans, licenses and sources
        run: cargo deny --locked check

  # C6: real worker isolation tests (docs/worker-isolation.md). The ordinary
  # `rust` job also compiles and runs these tests, but without bubblewrap they
  # log ISOLATION-TEST-SKIPPED and verify nothing. This job installs the
  # launcher, enables unprivileged user namespaces on the ephemeral hosted
  # runner (the only step that uses sudo; no secret, no token, read-only
  # contents), and fails if any isolation test is skipped.
  worker-isolation:
    name: "synthetic conformance: Linux worker isolation"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install bubblewrap and allow unprivileged user namespaces
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          bwrap --version
          command -v prlimit
          uname -sr
      - name: Isolation tests (must run, must not skip)
        shell: bash
        env:
          CUSTODIAN_REQUIRE_ISOLATION: "1"
        run: |
          cargo test -p custodian-worker --locked --test linux_isolation -- --nocapture --test-threads=4 2>&1 | tee isolation.log
          grep -q 'ISOLATION-VERIFIED' isolation.log
          ! grep -q 'ISOLATION-TEST-SKIPPED' isolation.log
      # S5: the daemon pipeline with the engine inside the real sandbox
      # (ADR 0129). An additional step; the one above is unchanged.
      - name: Daemon pipeline inside the real sandbox (must run, must not skip)
        shell: bash
        env:
          CUSTODIAN_REQUIRE_ISOLATION: "1"
        run: |
          cargo test -p custodian-daemon --locked --test linux_pipeline -- --nocapture --test-threads=1 2>&1 | tee pipeline-isolation.log
          grep -q 'PIPELINE-ISOLATION-VERIFIED' pipeline-isolation.log
          ! grep -q 'ISOLATION-TEST-SKIPPED' pipeline-isolation.log

  # Issue 54 (epic #40, S1/S2/S3; ADR 0137/0138/0139). The real
  # Sandbox/BubblewrapSandbox self-check and the full linux_isolation /
  # linux_pipeline suites -- network egress denial (covers DNS and
  # link-local as a strict subset: --unshare-net leaves no interface up
  # at all), host-file/credential/env denial, read-only staging,
  # fork-bomb/memory/disk/CPU/stdout-flood bounds, cancellation cleanup
  # and identity-tampering -- run unchanged on a real ARM64 host for the
  # first time, instead of only the kernel/tooling capability probe
  # arm64-sandbox-probe.yml added. Same steps as worker-isolation above,
  # deliberately not deduplicated into a matrix so a currently-expected
  # ARM64-specific failure here cannot be mistaken for a regression in
  # the existing, already-proven x86_64 job.
  worker-isolation-arm64:
    name: "synthetic conformance: ARM64 worker isolation (real sandbox, issue 54)"
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install bubblewrap and allow unprivileged user namespaces
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          bwrap --version
          command -v prlimit
          uname -sr
      - name: Isolation tests (must run, must not skip)
        shell: bash
        env:
          CUSTODIAN_REQUIRE_ISOLATION: "1"
        run: |
          cargo test -p custodian-worker --locked --test linux_isolation -- --nocapture --test-threads=4 2>&1 | tee isolation-arm64.log
          grep -q 'ISOLATION-VERIFIED' isolation-arm64.log
          ! grep -q 'ISOLATION-TEST-SKIPPED' isolation-arm64.log
      - name: Daemon pipeline inside the real sandbox (must run, must not skip)
        shell: bash
        env:
          CUSTODIAN_REQUIRE_ISOLATION: "1"
        run: |
          cargo test -p custodian-daemon --locked --test linux_pipeline -- --nocapture --test-threads=1 2>&1 | tee pipeline-isolation-arm64.log
          grep -q 'PIPELINE-ISOLATION-VERIFIED' pipeline-isolation-arm64.log
          ! grep -q 'ISOLATION-TEST-SKIPPED' pipeline-isolation-arm64.log
