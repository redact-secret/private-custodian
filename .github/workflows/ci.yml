name: ci

# Ordinary CI uses public synthetic tests only. It receives no secrets, no
# protected data, no signing material and no GitHub App credentials.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions/checkout v4.2.2, pinned to the commit its release tag points at.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # Uses the Rust toolchain preinstalled on the runner image; no third-party action.
      - name: Toolchain versions
        run: |
          rustup component add rustfmt clippy
          cargo --version
          rustc --version
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      # C12: a second, independent implementation of the canonical encoding and
      # the domain-separated digest, checked against the golden vectors. Python 3
      # standard library only (preinstalled on the runner); no package install.
      - name: Second-implementation golden vectors
        run: python3 crates/custodian-contracts/testdata/verify_golden.py

  # C12: dependency audit with a pinned tool and the policy in deny.toml
  # (RustSec advisories, yanked crates, licenses of third-party crates, crate
  # sources). cargo-deny is built from source with its own lockfile
  # (`--locked`) at an exact version; no third-party action and no secret. The
  # RustSec database is fetched fresh on every run by design: an audit against a
  # stale copy would prove little. Update the version here and in deny.toml
  # together, deliberately.
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install cargo-deny 0.20.2
        run: cargo install cargo-deny --locked --version 0.20.2
      - name: Check advisories, bans, licenses and sources
        run: cargo deny --locked check

  # C6: real worker isolation tests (docs/worker-isolation.md). The ordinary
  # `rust` job also compiles and runs these tests, but without bubblewrap they
  # log ISOLATION-TEST-SKIPPED and verify nothing. This job installs the
  # launcher, enables unprivileged user namespaces on the ephemeral hosted
  # runner (the only step that uses sudo; no secret, no token, read-only
  # contents), and fails if any isolation test is skipped.
  worker-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install bubblewrap and allow unprivileged user namespaces
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          bwrap --version
          command -v prlimit
          uname -sr
      - name: Isolation tests (must run, must not skip)
        shell: bash
        env:
          CUSTODIAN_REQUIRE_ISOLATION: "1"
        run: |
          cargo test -p custodian-worker --locked --test linux_isolation -- --nocapture --test-threads=4 2>&1 | tee isolation.log
          grep -q 'ISOLATION-VERIFIED' isolation.log
          ! grep -q 'ISOLATION-TEST-SKIPPED' isolation.log
