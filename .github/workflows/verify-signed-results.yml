name: verify-signed-results

# Reusable workflow (S1, ADR 0110): verify a signed public results bundle with
# the custodian-verify reference verifier, using pinned PUBLIC keys and pins
# only. See docs/ci-and-reusable-workflows.md for the caller guide, the exit
# codes and the trust model.
#
# FUNCTIONAL VERIFICATION ON PUBLIC DATA, NOT INDEPENDENT PROTECTED
# EVALUATION. A pass means the bundle is consistent with the supplied pins at
# the time given. It does not establish ground truth, and this repository is
# maintained by the Redact Secret project.
#
# FORBIDDEN HERE, AND DECLARED NOWHERE: this workflow declares no `secrets:`
# and needs none. It must never receive a protected corpus, a production
# signing key, a private-ledger token or a webhook secret.
#
# Calling it from another repository (private reuse needs the maintainer-only
# Actions access setting described in the doc):
#
#   jobs:
#     verify:
#       uses: redact-secret/private-custodian/.github/workflows/verify-signed-results.yml@<full-commit-sha>
#       with:
#         bundle-path: results/bundle
#         keys-file: pins/keys.json
#         feed-id: fed_...
#         expectations-file: pins/expectations.json
#         verifier-source-ref: <full-commit-sha-of-the-same-release>
on:
  workflow_call:
    inputs:
      bundle-path:
        description: "Bundle directory, relative to the caller checkout (or to the downloaded bundle artifact)."
        type: string
        required: true
      bundle-artifact-name:
        description: "Optional. Name of an artifact of the same run that holds the bundle; bundle-path is then relative to its root."
        type: string
        required: false
        default: ""
      keys-file:
        description: "Pinned public keys file (private-custodian.verify-keys/1), relative to the caller checkout."
        type: string
        required: true
      feed-id:
        description: "Pinned revocation feed id (fed_...)."
        type: string
        required: true
      expectations-file:
        description: "Expectations file (private-custodian.verify-expectations/1): domain, candidate, config, destination, populations, policies."
        type: string
        required: true
      now:
        description: "Unix seconds to judge at. Empty means the runner clock."
        type: string
        required: false
        default: ""
      verifier-source:
        description: "build: compile custodian-verify from verifier-source-repository at verifier-source-ref. artifact: use a binary from an artifact of the same run, pinned by verifier-sha256."
        type: string
        required: false
        default: "build"
      verifier-source-repository:
        description: "Repository to build the verifier from (build mode). The default GITHUB_TOKEN of the CALLER must be able to read it: the same repository, or a public one."
        type: string
        required: false
        default: "redact-secret/private-custodian"
      verifier-source-ref:
        description: "Full 40-hex commit SHA to build from (build mode). Branch and tag names are refused."
        type: string
        required: false
        default: ""
      verifier-artifact-name:
        description: "Artifact holding the custodian-verify binary (artifact mode)."
        type: string
        required: false
        default: ""
      verifier-sha256:
        description: "Expected SHA-256 of the custodian-verify binary (artifact mode); the run refuses a binary that differs."
        type: string
        required: false
        default: ""
      expected-exit-code:
        description: "Exit code this call must observe. 0 (default) means the bundle must be accepted. A negative test sets the rejection code it expects; the job then passes only if the verifier exits with exactly that code."
        type: string
        required: false
        default: "0"
      expected-reason:
        description: "Optional fixed reason code the result must carry (for example stale, revoked, bad_signature, feed_gap)."
        type: string
        required: false
        default: ""
    outputs:
      exit-code:
        description: "Exit code of custodian-verify."
        value: ${{ jobs.verify.outputs.exit-code }}
      verdict:
        description: "accepted, rejected or error."
        value: ${{ jobs.verify.outputs.verdict }}
      reason:
        description: "Fixed reason code from the result."
        value: ${{ jobs.verify.outputs.reason }}
      result-json:
        description: "The single sanitized JSON result object."
        value: ${{ jobs.verify.outputs.result-json }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      exit-code: ${{ steps.run.outputs.exit-code }}
      verdict: ${{ steps.run.outputs.verdict }}
      reason: ${{ steps.run.outputs.reason }}
      result-json: ${{ steps.run.outputs.result-json }}
    steps:
      # Inputs reach shell code only through environment variables, never by
      # interpolation into a script.
      - name: Validate inputs
        shell: bash
        env:
          BUNDLE_PATH: ${{ inputs.bundle-path }}
          KEYS_FILE: ${{ inputs.keys-file }}
          EXPECTATIONS_FILE: ${{ inputs.expectations-file }}
          FEED_ID: ${{ inputs.feed-id }}
          NOW: ${{ inputs.now }}
          SOURCE: ${{ inputs.verifier-source }}
          SOURCE_REPO: ${{ inputs.verifier-source-repository }}
          SOURCE_REF: ${{ inputs.verifier-source-ref }}
          ARTIFACT: ${{ inputs.verifier-artifact-name }}
          SHA256: ${{ inputs.verifier-sha256 }}
          BUNDLE_ARTIFACT: ${{ inputs.bundle-artifact-name }}
          EXPECTED_EXIT: ${{ inputs.expected-exit-code }}
          EXPECTED_REASON: ${{ inputs.expected-reason }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          rel() {
            case "$2" in
              ""|/*|*..*|*[[:space:]]*) fail "input $1 must be a relative path without '..' or whitespace";;
            esac
          }
          rel bundle-path "$BUNDLE_PATH"
          rel keys-file "$KEYS_FILE"
          rel expectations-file "$EXPECTATIONS_FILE"
          [[ "$FEED_ID" =~ ^fed_[A-Za-z0-9]{1,64}$ ]] || fail "feed-id is not a feed id"
          [[ "$NOW" =~ ^[0-9]{0,12}$ ]] || fail "now must be empty or Unix seconds"
          [[ "$EXPECTED_EXIT" =~ ^[0-9]{1,3}$ ]] || fail "expected-exit-code must be a number"
          [[ "$EXPECTED_REASON" =~ ^[a-z_]{0,48}$ ]] || fail "expected-reason must be a lowercase reason code"
          [[ "$BUNDLE_ARTIFACT" =~ ^[A-Za-z0-9._-]{0,100}$ ]] || fail "bundle-artifact-name is not a plain name"
          case "$SOURCE" in
            build)
              [[ "$SOURCE_REPO" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || fail "verifier-source-repository is not owner/name"
              [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]] || fail "verifier-source-ref must be a full 40-hex commit SHA"
              ;;
            artifact)
              [[ "$ARTIFACT" =~ ^[A-Za-z0-9._-]{1,100}$ ]] || fail "verifier-artifact-name is not a plain name"
              [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]] || fail "verifier-sha256 must be 64 lowercase hex characters"
              ;;
            *) fail "verifier-source must be build or artifact";;
          esac

      # actions/checkout v4.2.2, pinned to the commit its release tag points at.
      - name: Check out the caller repository (bundle, keys, expectations)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: caller
          persist-credentials: false

      # actions/download-artifact v8.0.1, pinned to the commit its tag points at.
      - name: Download the bundle artifact
        if: ${{ inputs.bundle-artifact-name != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.bundle-artifact-name }}
          path: bundle-download

      - name: Check out the verifier source (build mode)
        if: ${{ inputs.verifier-source == 'build' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ inputs.verifier-source-repository }}
          ref: ${{ inputs.verifier-source-ref }}
          path: verifier-src
          persist-credentials: false

      - name: Build custodian-verify (locked, release)
        if: ${{ inputs.verifier-source == 'build' }}
        shell: bash
        working-directory: verifier-src
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/verify-target
        run: |
          set -euo pipefail
          cargo --version
          cargo build --release --locked -p custodian-verify
          cp "$CARGO_TARGET_DIR/release/custodian-verify" "$RUNNER_TEMP/custodian-verify"

      - name: Download the verifier binary (artifact mode)
        if: ${{ inputs.verifier-source == 'artifact' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.verifier-artifact-name }}
          path: verifier-download

      - name: Pin the verifier binary by digest (artifact mode)
        if: ${{ inputs.verifier-source == 'artifact' }}
        shell: bash
        env:
          SHA256: ${{ inputs.verifier-sha256 }}
        run: |
          set -euo pipefail
          bin="verifier-download/custodian-verify"
          [ -f "$bin" ] && [ ! -L "$bin" ] || { echo "::error::artifact has no custodian-verify file"; exit 1; }
          actual="$(sha256sum "$bin" | cut -d' ' -f1)"
          [ "$actual" = "$SHA256" ] || { echo "::error::verifier binary digest does not match verifier-sha256"; exit 1; }
          cp "$bin" "$RUNNER_TEMP/custodian-verify"
          chmod 0755 "$RUNNER_TEMP/custodian-verify"

      - name: Verify
        id: run
        shell: bash
        env:
          BUNDLE_PATH: ${{ inputs.bundle-path }}
          BUNDLE_ARTIFACT: ${{ inputs.bundle-artifact-name }}
          KEYS_FILE: ${{ inputs.keys-file }}
          EXPECTATIONS_FILE: ${{ inputs.expectations-file }}
          FEED_ID: ${{ inputs.feed-id }}
          NOW: ${{ inputs.now }}
          EXPECTED_EXIT: ${{ inputs.expected-exit-code }}
          EXPECTED_REASON: ${{ inputs.expected-reason }}
        run: |
          set -euo pipefail
          if [ -n "$BUNDLE_ARTIFACT" ]; then bundle="bundle-download/$BUNDLE_PATH"; else bundle="caller/$BUNDLE_PATH"; fi
          now="${NOW:-$(date +%s)}"
          set +e
          json="$("$RUNNER_TEMP/custodian-verify" \
            --bundle "$bundle" \
            --keys "caller/$KEYS_FILE" \
            --feed-id "$FEED_ID" \
            --expect "caller/$EXPECTATIONS_FILE" \
            --now "$now")"
          code=$?
          set -e
          # Whatever the binary printed is data: keep one bounded line, take
          # only fixed-vocabulary fields out of it.
          json="$(printf '%s' "$json" | head -n 1 | head -c 4096)"
          read -r verdict reason < <(printf '%s' "$json" | python3 -c '
          import json, re, sys
          try:
              o = json.load(sys.stdin)
              v, r = str(o.get("verdict", "")), str(o.get("reason", ""))
              ok = re.fullmatch(r"[a-z_]{1,48}", v) and re.fullmatch(r"[a-z_]{1,48}", r)
              print(v, r) if ok else print("error unparseable")
          except Exception:
              print("error unparseable")
          ')
          {
            echo "exit-code=$code"
            echo "verdict=$verdict"
            echo "reason=$reason"
            echo "result-json=$json"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### custodian-verify"
            echo
            echo "| exit code | verdict | reason | expected exit | expected reason |"
            echo "|---|---|---|---|---|"
            echo "| $code | $verdict | $reason | $EXPECTED_EXIT | ${EXPECTED_REASON:-any} |"
            echo
            echo "_Functional verification on public data against supplied pins. Not an independent protected evaluation._"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" != "$EXPECTED_EXIT" ]; then
            echo "::error::verifier exit code did not match expected-exit-code (see the job summary)"
            exit 1
          fi
          if [ -n "$EXPECTED_REASON" ] && [ "$reason" != "$EXPECTED_REASON" ]; then
            echo "::error::verifier reason did not match expected-reason (see the job summary)"
            exit 1
          fi
