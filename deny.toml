# cargo-deny policy for the dependency audit job in .github/workflows/ci.yml (C12).
# Checks advisories (RustSec), yanked crates, licenses of third-party crates, wildcard
# requirements and crate sources. Workspace crates are `publish = false` and carry no
# license on purpose (README.md "Publication and licensing"), so they are ignored by the
# license check via `private.ignore`. This file does not choose a license for the project.
#
# Pinned tool: cargo-deny 0.20.2 (see the workflow). Update both together, deliberately.

[graph]
all-features = true

[advisories]
unmaintained = "all"
yanked = "deny"

[licenses]
# Licenses seen across the current third-party dependency set. A new license is a
# reviewed change to this list, not an automatic allowance.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-1-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
