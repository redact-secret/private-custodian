[package]
name = "custodian-cli"
description = "Operator CLI and service startup wiring: authenticated roles, the same authorization, idempotency and budget control plane as the request edge (C10). Synthetic data only; no credentials."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "custodian_cli"
path = "src/lib.rs"

[[bin]]
name = "custodian"
path = "src/main.rs"

# C12 measurements (docs/measurements.md). `test = true` runs only the example's
# own tiny consistency test under `cargo test`; the timings run on demand.
[[example]]
name = "c12_measure"
path = "examples/c12_measure.rs"
test = true

# No new third-party crate (ADR 0080; ADR 0113 for the signer transport crate): argument parsing is std, hashing is the
# workspace-pinned sha2, JSON is the workspace-pinned serde_json.
[dependencies]
custodian-core = { path = "../custodian-core" }
custodian-contracts = { path = "../custodian-contracts" }
custodian-store = { path = "../custodian-store" }
custodian-intake = { path = "../custodian-intake" }
custodian-corpus = { path = "../custodian-corpus" }
custodian-ledger = { path = "../custodian-ledger" }
custodian-signer = { path = "../custodian-signer" }
custodian-lifecycle = { path = "../custodian-lifecycle" }
custodian-disclosure = { path = "../custodian-disclosure" }
custodian-worker = { path = "../custodian-worker" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"

[dev-dependencies]
custodian-worker = { path = "../custodian-worker", features = ["test-fakes"] }
# C12 end-to-end tests only: the benchmarks-side consumer. A path dependency inside
# this workspace; no third-party crate is added.
custodian-bridge = { path = "../custodian-bridge" }
