[package]
name = "custodian-corpus"
description = "Protected population storage, sealing and reviewed registry behind the CorpusAccess port (C5). Filesystem adapter; synthetic data only."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

# Exact pins, same versions as custodian-contracts (ADR 0004, ADR 0030). No
# new third-party crate: HMAC-SHA-256 is built on sha2 and checked against
# RFC 4231 vectors (ADR 0031).
[dependencies]
custodian-core = { path = "../custodian-core" }
custodian-contracts = { path = "../custodian-contracts" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
