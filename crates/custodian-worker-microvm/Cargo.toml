[package]
name = "custodian-worker-microvm"
description = "Offline remote-worker contract experiment; not a deployed or verified sandbox."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
custodian-contracts = { path = "../custodian-contracts" }
custodian-worker = { path = "../custodian-worker" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"

# Test-only: the crash-matrix fencing tests (issue #44) drive the real,
# authoritative store `custodian-worker` depends on, because the fencing,
# idempotent settlement and conservative-refund behavior they probe lives
# there, not in this crate's stateless envelope parser.
[dev-dependencies]
custodian-core = { path = "../custodian-core" }
custodian-store = { path = "../custodian-store" }

[[bin]]
name = "custodian-microvm-synthetic-health"
path = "../../deploy/aws/microvm/health.rs"

[[bin]]
name = "custodian-microvm-isolation-probe"
path = "../../deploy/aws/microvm/probe.rs"
