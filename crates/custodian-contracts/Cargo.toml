[package]
name = "custodian-contracts"
description = "Versioned request, approval, reservation, execution, receipt, public projection and revocation contracts with canonical encoding (C2)."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

# Exact pins (ADR 0004). Upgrades are deliberate, reviewed changes with Cargo.lock.
[dependencies]
custodian-core = { path = "../custodian-core" }
schemars = "=1.2.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
