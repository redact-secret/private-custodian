[package]
name = "custodian-intake"
description = "Request-facing GitHub App adapter (Z1): signed webhook intake, App authentication behind traits, scoped sanitized Check updates (C3)."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

# Exact pins (ADR 0010). Upgrades are deliberate, reviewed changes with Cargo.lock.
[dependencies]
custodian-core = { path = "../custodian-core" }
custodian-contracts = { path = "../custodian-contracts" }
hmac = "=0.12.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
